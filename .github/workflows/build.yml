name: flame-debian

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            debootstrap qemu-user-static binfmt-support e2fsprogs xz-utils
          # make sure the keyring knows the trixie signing keys
          keyring=$(curl -fsSL https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/ \
            | grep -oE 'debian-archive-keyring_[^"]+_all\.deb' | sort -V | tail -1)
          curl -fsSLO "https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/$keyring"
          sudo dpkg -i "$keyring"

      - name: Build Debian 13 arm64 rootfs (Waydroid-ready)
        run: |
          sudo update-binfmts --enable qemu-aarch64 || true
          sudo bash scripts/build-debian-rootfs.sh out/flame-debian-rootfs.img
          ls -lh out/

      - name: Validate rootfs
        run: |
          set -e
          cd out
          xz -t flame-debian-rootfs.img.xz
          # the runner refuses to set up a loop device, so read the ext4 image
          # directly through debugfs instead of mounting it
          IMG=flame-debian-rootfs.img
          has() {
            sudo debugfs -R "stat $1" $IMG 2>/dev/null | grep -q 'Inode: '
          }
          for p in /sbin/init /lib/systemd/systemd /usr/bin/phoc /usr/libexec/phosh \
                   /usr/bin/dbus-run-session /etc/phosh/phoc.ini /etc/hostname \
                   /etc/modules-load.d/flame.conf \
                   /etc/systemd/system/getty.target.wants/serial-getty@ttyGS0.service \
                   /etc/systemd/system/multi-user.target.wants/phosh.service; do
            if has "$p"; then echo "ok: $p"; else echo "MISSING in rootfs: $p"; exit 1; fi
          done
          # nice-to-haves: report, do not fail the build on these
          for p in /usr/bin/osmo /usr/bin/waydroid /usr/bin/squeekboard /usr/bin/weston; do
            has "$p" && echo "ok: $p" || echo "warn: $p not installed"
          done
          sudo debugfs -R "cat /etc/hostname" $IMG
          # keep only the compressed image in the artifact
          sudo rm -f $IMG
          cp ../boot-safety.txt BOOT-SAFETY.txt
          sha256sum flame-debian-rootfs* BOOT-SAFETY.txt > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flame-debian-${{ github.sha }}
          path: out/
          if-no-files-found: error
