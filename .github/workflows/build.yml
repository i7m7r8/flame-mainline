name: flame-debian

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            debootstrap qemu-user-static binfmt-support e2fsprogs xz-utils
          # make sure the keyring knows the trixie signing keys
          keyring=$(curl -fsSL https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/ \
            | grep -oE 'debian-archive-keyring_[^"]+_all\.deb' | sort -V | tail -1)
          curl -fsSLO "https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/$keyring"
          sudo dpkg -i "$keyring"

      - name: Build Debian 13 arm64 rootfs (Waydroid-ready)
        run: |
          sudo update-binfmts --enable qemu-aarch64 || true
          sudo bash scripts/build-debian-rootfs.sh out/flame-debian-rootfs.img
          ls -lh out/

      - name: Package artifact
        run: |
          set -e
          cd out
          # the script compresses with `xz -f`, which drops the raw image
          sudo rm -f flame-debian-rootfs.img
          sudo cp ../boot-safety.txt BOOT-SAFETY.txt
          sudo sha256sum flame-debian-rootfs* BOOT-SAFETY.txt | sudo tee SHA256SUMS >/dev/null
          sudo chown $(id -u):$(id -g) . *
          ls -lh
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flame-debian-${{ github.sha }}
          path: out/
          if-no-files-found: error
