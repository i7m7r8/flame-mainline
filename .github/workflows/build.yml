name: flame-debian

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            debootstrap qemu-user-static binfmt-support e2fsprogs xz-utils
          # make sure the keyring knows the trixie signing keys
          keyring=$(curl -fsSL https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/ \
            | grep -oE 'debian-archive-keyring_[^"]+_all\.deb' | sort -V | tail -1)
          curl -fsSLO "https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/$keyring"
          sudo dpkg -i "$keyring"

      - name: Build Debian 13 arm64 rootfs (Waydroid-ready)
        run: |
          sudo update-binfmts --enable qemu-aarch64 || true
          sudo bash scripts/build-debian-rootfs.sh out/flame-debian-rootfs.img
          ls -lh out/

      - name: Validate rootfs
        run: |
          set -e
          cd out
          xz -t flame-debian-rootfs.img.xz
          sudo mkdir -p /mnt/rootfs
          sudo mount -o loop,ro flame-debian-rootfs.img /mnt/rootfs
          ls /mnt/rootfs/sbin/init
          test -x /mnt/rootfs/lib/systemd/systemd
          test -f /mnt/rootfs/etc/systemd/system/getty.target.wants/serial-getty@ttyGS0.service
          test -f /mnt/rootfs/etc/systemd/system/multi-user.target.wants/phosh.service
          test -x /mnt/rootfs/usr/bin/phoc
          grep -q flame /mnt/rootfs/etc/hostname
          if [ -f /mnt/rootfs/root/setup-status.txt ]; then cat /mnt/rootfs/root/setup-status.txt; fi
          sudo umount /mnt/rootfs
          sudo rmdir /mnt/rootfs
          # keep only the compressed image in the artifact
          sudo rm -f flame-debian-rootfs.img
          cp ../boot-safety.txt BOOT-SAFETY.txt
          sha256sum flame-debian-rootfs* BOOT-SAFETY.txt > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flame-debian-${{ github.sha }}
          path: out/
          if-no-files-found: error
