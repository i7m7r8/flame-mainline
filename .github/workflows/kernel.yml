name: mainline kernel (flame)

# Builds upstream Linux for SM4450 with the ROCKNIX SM4450 patch series plus
# this repo's flame board DTS. Image + dtbs only (milestones P0/P1); the EL1
# shim and boot_b packing come once the tree builds clean.

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: upstream stable version to build
        default: '7.1.2'
        required: true
        type: string
      rocknix_ref:
        description: ROCKNIX/distribution ref holding the SM4450 patches
        default: 'next'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'dts/**'
      - 'patches/**'
      - 'config/flame.fragment'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/kernel.yml'

env:
  KERNEL_VERSION: ${{ inputs.kernel_version || '7.1.2' }}
  ROCKNIX_REF: ${{ inputs.rocknix_ref || 'next' }}
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          set -euo pipefail
          # these come from workflow_dispatch and end up in URLs and shell args
          case "$KERNEL_VERSION" in
            *[!0-9.]*|''|*/*) echo "bad kernel_version: $KERNEL_VERSION"; exit 1 ;;
          esac
          case "$ROCKNIX_REF" in
            *[!A-Za-z0-9._-]*|''|*/*) echo "bad rocknix_ref: $ROCKNIX_REF"; exit 1 ;;
          esac
          series="v$(echo "$KERNEL_VERSION" | cut -d. -f1).x"
          echo "SERIES=$series" >> "$GITHUB_ENV"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libelf-dev libssl-dev cpio rsync xz-utils \
            device-tree-compiler patch make gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu qemu-system-arm \
            kmod python3

      # A few seconds, and it is the only thing standing between a green build
      # and a boot image that dies before primary_entry, so run it before the
      # 20 minute kernel build rather than after.
      - name: Self-test handover shim
        run: tests/shim/run.sh

      - name: Cache source tarball
        uses: actions/cache@v4
        with:
          path: dl
          key: linux-${{ env.KERNEL_VERSION }}

      - name: Fetch kernel
        run: |
          set -euo pipefail
          mkdir -p dl "$RUNNER_TEMP/build"
          T="linux-${KERNEL_VERSION}.tar.xz"
          [ -s "dl/$T" ] || curl -fSL --retry 3 -o "dl/$T" \
            "https://cdn.kernel.org/pub/linux/kernel/${SERIES}/${T}"
          tar -xf "dl/$T" -C "$RUNNER_TEMP/build"
          echo "SRC=$RUNNER_TEMP/build/linux-${KERNEL_VERSION}" >> "$GITHUB_ENV"

      - name: Fetch ROCKNIX SM4450 patch series
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            "https://github.com/ROCKNIX/distribution" -b "$ROCKNIX_REF" rocknix
          git -C rocknix sparse-checkout set \
            projects/ROCKNIX/devices/SM4450/patches/linux
          PATCHDIR="$GITHUB_WORKSPACE/rocknix/projects/ROCKNIX/devices/SM4450/patches/linux"
          echo "PATCHDIR=$PATCHDIR" >> "$GITHUB_ENV"
          ls "$PATCHDIR" | wc -l

      - name: Apply patch series
        run: |
          set -uo pipefail
          cd "$SRC"
          mkdir -p "$GITHUB_WORKSPACE/out"
          rep="$GITHUB_WORKSPACE/out/patch-report.txt"
          : > "$rep"
          applied=0
          already=0
          rejected=0

          # Dry run first: a half-applied patch breaks every later one. -N makes
          # "already in the tree" an exit-1 case, which is not a failure - as
          # upstream absorbs the SM4450 series these will drop out by them-
          # selves. Only context that genuinely does not match is a reject.
          apply() {
            local out rc
            out=$(patch -p1 -N -f --dry-run -i "$1" 2>&1)
            rc=$?
            if [ "$rc" -ne 0 ]; then
              if printf '%s\n' "$out" | grep -qE 'Reversed \(or previously applied\)|Skipping patch'; then
                echo "already   $2" >> "$rep"
                already=$((already+1))
              else
                printf 'REJECT    %s\n%s\n' "$2" "$out" | tee -a "$rep"
                rejected=$((rejected+1))
              fi
              return 0
            fi
            if patch -p1 -N -f -i "$1" >/dev/null 2>&1; then
              echo "ok        $2" >> "$rep"
              applied=$((applied+1))
            else
              echo "REJECT    $2 (failed while applying)" | tee -a "$rep"
              rejected=$((rejected+1))
            fi
          }

          while read -r p; do
            case "$p" in ''|'#'*) continue ;; esac
            if [ ! -f "$PATCHDIR/$p" ]; then
              echo "MISSING   $p" | tee -a "$rep"
              rejected=$((rejected+1)); continue
            fi
            apply "$PATCHDIR/$p" "$p"
          done < "$GITHUB_WORKSPACE/patches/rocknix-sm4450.txt"

          for p in "$GITHUB_WORKSPACE"/patches/local/*.patch; do
            [ -e "$p" ] || continue
            apply "$p" "local/$(basename "$p")"
          done

          echo "applied=$applied already=$already rejected=$rejected" | tee -a "$rep"
          find . -name '*.rej' -print > "$GITHUB_WORKSPACE/out/rejects.txt" || true
          test "$rejected" -eq 0   # P0 gate: see patch-report.txt / rejects.txt

      - name: Install local drivers
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tools/install_local.py" \
            "$SRC" "$GITHUB_WORKSPACE/patches/local"

      - name: Install flame board DTS
        run: |
          set -euo pipefail
          cd "$SRC"
          cp "$GITHUB_WORKSPACE/dts/sm4450-xiaomi-flame.dts" arch/arm64/boot/dts/qcom/
          python3 - <<'PY'
          import re
          p = 'arch/arm64/boot/dts/qcom/Makefile'
          lines = open(p).read().splitlines()
          if any('sm4450-xiaomi-flame' in l for l in lines):
              raise SystemExit('already listed')
          for i, l in enumerate(lines):
              if l.startswith('dtb-$(CONFIG_ARCH_QCOM)'):
                  lines.insert(i + 1, 'dtb-$(CONFIG_ARCH_QCOM)\t+= sm4450-xiaomi-flame.dtb')
                  break
          else:
              raise SystemExit('no CONFIG_ARCH_QCOM block')
          open(p, 'w').write('\n'.join(lines) + '\n')
          PY
          grep -n 'sm4450' arch/arm64/boot/dts/qcom/Makefile

      - name: Configure
        run: |
          set -euo pipefail
          cd "$SRC"
          make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE defconfig
          # arch/arm64/configs/defconfig is a *module* config: 1332 symbols come
          # out =m. With CONFIG_MODULES=n those are promoted to built-in, which
          # would link Apple, Allwinner and Raspberry Pi drivers into a phone
          # kernel and grow the Image by a factor of several, so the module
          # state is turned off first and flame's fragment re-enables, by name,
          # the handful that this board actually needs.
          sed -i 's/=m$/=n/' .config
          ./scripts/kconfig/merge_config.sh -m .config \
            "$GITHUB_WORKSPACE/config/flame.fragment"
          make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE olddefconfig
          # These two are not tuning. Without the hook the kernel never reads
          # what the shim parked, so the androidboot.* tags and the address of
          # the ROM's first stage init are gone; without the initrd support
          # there is nothing to mount /vendor with. olddefconfig drops a symbol
          # whose dependencies are not met, which is exactly how this would
          # break quietly.
          for sym in ARM64_HANDOVER_CMDLINE BLK_DEV_INITRD; do
            grep -qx "CONFIG_$sym=y" .config || {
              echo "CONFIG_$sym is not y in .config" >&2; exit 1; }
          done
          # Nothing on this device can load a .ko - the boot image carries a
          # kernel section only, /vendor is read-only under AVB, and a stock
          # module will not load into a mainline kernel or the other way round.
          # So =m means "absent", and olddefconfig demotes =y to =m without a
          # word whenever a dependency is a module: that is how DRM_MSM and the
          # whole audio family went missing from the Image silently.
          if grep -q '=m$' .config; then
            echo "CONFIG_MODULES=n did not hold; these would be unloadable:" >&2
            grep '=m$' .config | head -20 >&2
            exit 1
          fi
          dropped=0
          for want in $(grep -oE '^CONFIG_[A-Za-z0-9_]+=y' \
                         "$GITHUB_WORKSPACE/config/flame.fragment"); do
            grep -qx "$want" .config || {
              echo "$want is not in .config: unknown name or unmet dependency" >&2
              dropped=1; }
          done
          [ "$dropped" -eq 0 ] || exit 1
          cp .config "$GITHUB_WORKSPACE/out/flame.config"

      - name: Build Image and dtbs
        run: |
          set -euo pipefail
          cd "$SRC"
          # Only flame's dtb: `dtbs` builds ~1500 boards and adds ~4 minutes.
          # The top-level `%.dtb` rule prepends $(dtstree) itself, so the target
          # has to be relative to arch/arm64/boot/dts/ or kbuild asks for
          # arch/arm64/boot/dts/arch/arm64/boot/dts/qcom/... and stops.
          make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE -j"$(nproc)" \
            Image qcom/sm4450-xiaomi-flame.dtb \
            2>&1 | tee "$GITHUB_WORKSPACE/out/build.log"
          ls -la arch/arm64/boot/Image arch/arm64/boot/dts/qcom/sm4450-xiaomi-flame.dtb

      - name: Package
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/out"
          cp "$SRC/arch/arm64/boot/Image" Image
          cp "$SRC/arch/arm64/boot/dts/qcom/sm4450-xiaomi-flame.dtb" .
          grep -E '^(CONFIG_(DRM_MSM|INTERCONNECT_QCOM_SM4450|SM_GCC_4450|SM_DISPCC_4450|SM_GPUCC_4450|SM_CAMCC_4450|PINCTRL_SM4450|MMC_SDHCI_MSM|SCSI_UFS_QCOM|USB_DWC3_QCOM|PHY_QCOM.*|ATH10K.*|BT_QCA|SND_SOC.*|QCOM_GPI_DMA|TOUCHSCREEN.*|REGULATOR_QCOM.*|IOMMU.*|QCOM_PMIC_GLINK|UCSI_PMIC_GLINK|BATTERY_QCOM_BATTMGR|QCOM_SOCINFO|RPMSG_QCOM_GLINK.*|QCOM_APR|QRTR.*))=' \
            flame.config > enabled.txt || true
          dtc -I dtb -O dts sm4450-xiaomi-flame.dtb > sm4450-xiaomi-flame.cdt.dts 2>/dev/null
          ls -lh
          cat enabled.txt

      - name: Pack boot image
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/out"
          # header v4 with the stock os_version (Android 17, 2026-10 patch
          # level) and an empty cmdline, exactly like the ROM's own boot.img:
          # everything cmdline related arrives through the device tree.
          python3 "$GITHUB_WORKSPACE/tools/mklinuxpayload.py" \
            --image Image --dtb sm4450-xiaomi-flame.dtb \
            --image-load 0xC0000000 --dtb-load 0xBFE00000 \
            --scratch-load 0xBC000000 \
            --cc-prefix "$CROSS_COMPILE" \
            -o payload.bin
          python3 "$GITHUB_WORKSPACE/tools/mkbootimg_v4.py" \
            --kernel payload.bin --android 17 --patch-level 2026-10 \
            -o flame-mainline-boot.img
          python3 - <<'PY' | tee packing.txt
          import struct
          d = open('payload.bin', 'rb').read()
          image = open('Image', 'rb').read()
          dtb = open('sm4450-xiaomi-flame.dtb', 'rb').read()
          # ABI 2 puts the Image itself at payload offset 0, so the header block
          # is not where a v1 payload's would be. It is the last copy of the
          # magic in the file: nothing before it can contain that string, and
          # the shim's page is the last thing appended.
          found = d.rfind(b'SWEETLNX')
          assert found > 0 and found % 4096 == 0, hex(found)
          (magic, ver, flags, ioff, isz, doff, dsz, iload, dload,
           eoff, soff, hoff, rfu, sload) = \
              struct.unpack('<8sIIIIIIQQIIIIQ', d[found:found + 72])
          assert magic == b'SWEETLNX' and ver == 2, (magic, ver)
          assert found == hoff, (hex(found), hex(hoff))
          assert soff == hoff + 4096, 'the shim does not follow its own header page'
          assert ioff == 0 and isz == len(image), (ioff, isz, len(image))
          assert d[doff:doff + dsz] == dtb, 'dtb mismatch'
          # The packed Image must equal the build except for the one word that
          # was turned into `b shim`, and that word must really jump to the
          # shim's page. Anything else here means the loader would run a kernel
          # whose entry address does not match what the shim is told.
          packed = d[ioff:ioff + isz]
          pages = [i for i in range(0, isz, 4096)
                   if packed[i:i + 4096] != image[i:i + 4096]]
          assert pages == [0], f'more than the header page changed: {pages}'
          patch = [i for i in range(4096) if packed[i] != image[i]]
          assert patch, 'nothing was patched, so the loader would run head.S directly'
          assert all(4 <= i < 8 for i in patch) or all(i < 4 for i in patch), patch
          # which word was replaced is decided by where the bytes differ, and the
          # top byte of the two encodings can be the same value, so the run of
          # differing bytes may be shorter than four
          patch_off = 4 if max(patch) >= 4 else 0
          word = struct.unpack('<I', packed[patch_off:patch_off + 4])[0]
          assert word >> 26 == 0b000101, f'{word:#010x} is not b, not bl'
          disp = word & 0x3FFFFFF
          if disp & 0x2000000:
              disp -= 0x4000000
          assert patch_off + disp * 4 == soff, (hex(patch_off), hex(soff))
          if patch_off == 4:
              assert struct.unpack('<I', packed[:4])[0] == 0xfa405a4d, \
                  'the MZ signature nop that UEFI loaders look for is gone'
          # what the shim will jump to, recomputed from the *unpatched* Image
          src = struct.unpack('<I', image[patch_off:patch_off + 4])[0]
          sd = src & 0x3FFFFFF
          if sd & 0x2000000:
              sd -= 0x4000000
          assert patch_off + sd * 4 == eoff, (hex(patch_off), hex(eoff))
          assert struct.unpack('<Q', image[8:16])[0] == 0, 'text_offset is not 0'
          # The handover region is where the shim parks the bootloader's tree and
          # where arch/arm64/kernel/handover.c looks: 0xbc000000..0xbe000000,
          # reserved without no-map in the board DTS. Neither destination may
          # fall in it, and the payload says so explicitly rather than by
          # comment, because the DTS and this header are edited separately.
          assert sload == 0xBC000000, hex(sload)
          runtime = max(struct.unpack('<Q', image[16:24])[0], isz)
          for base, size, name in ((iload, runtime, 'image'), (dload, dsz, 'dtb')):
              assert base + size <= sload or sload + 0x200000 <= base, \
                     f'{name} overlaps the handover region'
          print(f'payload {len(d)} bytes  abi={ver} flags={flags:#x}')
          print(f'  image +{ioff:#08x} len {isz:#x} file, {runtime:#x} runtime'
                f' -> {iload:#010x}')
          print(f'  dtb   +{doff:#08x} len {dsz:#x} -> {dload:#010x}')
          print(f'  entry +{eoff:#06x}  shim +{soff:#06x}  hdr +{hoff:#06x}'
                f'  (Image+{patch_off:#x} patched)')
          print(f'  handover {sload:#010x}+0x200000')
          PY
          cp "$GITHUB_WORKSPACE/flash-boot.txt" FLASH.txt
          cp "$GITHUB_WORKSPACE/boot-safety.txt" BOOT-SAFETY.txt
          sha256sum Image sm4450-xiaomi-flame.dtb payload.bin \
            flame-mainline-boot.img > SHA256SUMS
          ls -lh flame-mainline-boot.img payload.bin
          cat SHA256SUMS

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flame-mainline-${{ github.sha }}
          path: out/
          if-no-files-found: warn
